name: Research code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Publication and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install synthetic test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Test publication and local input handling
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Test the component-score explorer
        run: node --test tests/test_demo*.cjs
      - name: Check Python syntax without running analyses
        run: python -m compileall -q analysis examples tools tests
      - name: Scan files intended for publication
        run: python tools/check_public_tree.py --root .
      - name: Check whitespace
        run: git diff --check
